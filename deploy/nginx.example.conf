# Use this when an nginx already terminates TLS on the host (e.g. next to 3x-ui).
# Obtain the certificate with certbot; the app itself listens on 127.0.0.1:8080.
server {
    listen 443 ssl http2;
    server_name cab.example.com;

    ssl_certificate     /etc/letsencrypt/live/cab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cab.example.com/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name cab.example.com;
    return 301 https://$host$request_uri;
}
