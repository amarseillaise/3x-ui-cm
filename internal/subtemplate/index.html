<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{ if .subTitle }}{{ .subTitle }}{{ else }}Кабинет подписки{{ end }}</title>
<!--
  No automatic redirect on purpose: a page that instantly sends the visitor to
  another address is a classic sign of a phishing chain, and Safari showed a
  "deceptive site" warning on some iPhones. The visitor taps the button instead.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #0b1120; color: #e2e8f0;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 28rem; margin: 0 auto; padding: 4rem 1rem; text-align: center; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1rem; }
  p { margin: 0 0 1.5rem; color: #94a3b8; }
  .btn { display: inline-block; padding: .75rem 1.5rem; border-radius: .75rem; background: #2563eb;
    color: #fff; text-decoration: none; font-weight: 600; }
  .hint { margin-top: 2rem; font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1>{{ if .subTitle }}{{ .subTitle }}{{ else }}Кабинет подписки{{ end }}</h1>
  <p>Срок подписки, трафик, продление и уведомления — в личном кабинете.</p>
  <a class="btn" href="__APP_BASE_URL__/s/{{ .sId }}">Открыть кабинет</a>
  <p class="hint">Эту же ссылку добавьте в VPN-приложение как подписку.</p>
</main>
</body>
</html>
