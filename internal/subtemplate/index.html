<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="0;url=__APP_BASE_URL__/s/{{ .sId }}">
<title>{{ if .subTitle }}{{ .subTitle }}{{ else }}Кабинет подписки{{ end }}</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #0b1120; color: #e2e8f0;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 28rem; margin: 0 auto; padding: 4rem 1rem; text-align: center; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1rem; }
  p { margin: 0 0 1.5rem; color: #94a3b8; }
  .btn { display: inline-block; padding: .75rem 1.5rem; border-radius: .75rem; background: #2563eb;
    color: #fff; text-decoration: none; font-weight: 600; }
  .hint { margin-top: 2rem; font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1>{{ if .subTitle }}{{ .subTitle }}{{ else }}Кабинет подписки{{ end }}</h1>
  <p>Открываем кабинет подписки…</p>
  <a class="btn" href="__APP_BASE_URL__/s/{{ .sId }}">Перейти в кабинет</a>
  <p class="hint">Эта же ссылка добавляется в VPN-приложение как подписка.</p>
</main>
<script>location.replace("__APP_BASE_URL__/s/{{ .sId }}");</script>
</body>
</html>
